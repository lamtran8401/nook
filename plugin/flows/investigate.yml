# The flow of an item of kind investigate: what the guards of each move ask for. nook doctor checks this file.
kind: investigate
spec:
  criteria: none
  questions: required  # the questions under ## Questions
areas: optional        # an investigation can touch no code
slices: optional       # with a tasks.md, its slices run and verify as the slices of a feature
submit:
  - findings           # submit: findings.md has a ## Results part; accept: each question has an answer with evidence
