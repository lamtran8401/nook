# The flow of an item of kind fix: what the guards of each move ask for. nook doctor checks this file.
kind: fix
spec:
  criteria: required   # acceptance criteria under ## Acceptance criteria
  questions: none
  sections: [Reproduce, Actual, Expected]   # each has text before agree; the ticket gives them
slices: required       # tasks.md with slices; the slices done and verified before submit
submit:
  - root-cause         # root-cause.md has a type and the analysis; begin writes it from its template
